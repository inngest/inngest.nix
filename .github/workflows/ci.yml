name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Evaluate flake
        run: nix flake check --all-systems --no-build

      # Use the locked nixpkgs input for the build tool. nix-fast-build writes
      # its results to the GitHub job summary without a separate reporting bot.
      - name: Build package
        run: |
          nix shell --inputs-from . nixpkgs#nix-fast-build -c \
            nix-fast-build --flake '.#packages.${{ matrix.system }}' \
              --select 'packages: { inherit (packages) inngest; }'

      - name: Run installed CLI
        run: nix run . -- version
